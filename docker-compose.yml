# Local / single-host stack. Secrets come from the shell or a `.env` file next to this file
# (Compose reads it automatically for ${...} substitution); nothing secret is hardcoded here.
#
#   docker compose up -d --build                    # postgres + migrations + api (local storage)
#   docker compose --profile minio up -d --build    # + MinIO (S3-compatible) for STORAGE_DRIVER=s3
#   docker compose run --rm api node dist/prisma/seed.js   # create the first SUPER_ADMIN
#
# Required: POSTGRES_PASSWORD, JWT_ACCESS_SECRET.

name: wallpaper

x-api-env: &api-env
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgresql://wallpaper:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/wallpaper?schema=public
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET (>= 32 random chars)}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-strict}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  SWAGGER_USER: ${SWAGGER_USER:-}
  SWAGGER_PASSWORD: ${SWAGGER_PASSWORD:-}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost:3000/media}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  BANNER_URL_ALLOWED_HOSTS: ${BANNER_URL_ALLOWED_HOSTS:-}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Super Admin}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallpaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: wallpaper
    # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallpaper -d wallpaper"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published on the host by default; uncomment for local tooling.
    # ports: ["127.0.0.1:5432:5432"]

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://wallpaper:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/wallpaper?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment: *api-env
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - media:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID for MinIO}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY for MinIO}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    profiles: ["minio"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing local/$${BUCKET} &&
      mc anonymous set download local/$${BUCKET}/media
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
      BUCKET: ${S3_BUCKET:-wallpapers}
    restart: "no"

volumes:
  pgdata:
  media:
  minio:
